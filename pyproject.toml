[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-agent"
version = "0.2.0"
description = "Quotation field extraction baseline for the SME Procurement-Preparation Agent"
requires-python = ">=3.10"
# No application framework. Project Charter v1.1 has not chosen one, and Week 2
# must not force that decision.
dependencies = []

[project.optional-dependencies]
# The provider SDK is optional so that the test suite installs and runs without
# it, with no API key and no network.
gemini = ["google-genai>=1.0"]
# Week 3 retrieval. Qdrant runs in local mode (no server) and FastEmbed runs the
# embedding model locally. Neither needs network at test time: tests inject a
# fake embedder, and FastEmbed only downloads its model when one is actually
# loaded. query_points, which retrieval uses, arrived in qdrant-client 1.10.
rag = ["qdrant-client>=1.10", "fastembed>=0.3"]
dev = ["pytest>=7.0"]
# Security and audit tools used by .github/workflows/ci.yml. Semgrep is
# installed in CI only (it is a large extra); run it locally with
# `pip install semgrep` if you want the same scan on your laptop.
ci = [
    "pytest>=7.0",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
procurement-extract = "procurement_agent.cli:main"
procurement-policy = "procurement_agent.rag.cli:main"
procurement-policy-ingest = "procurement_agent.rag.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
# Asserts in application code would still be flagged. Tests are excluded above.
